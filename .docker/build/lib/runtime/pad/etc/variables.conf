# This file contains environment variables for all settings, that can be used to override

# Admin/M2EE server configuration
admin {
  port = ${?ADMIN_PORT}
  addresses = ${?ADMIN_ADDRESSES}
  adminPassword = ${?ADMIN_ADMINPASSWORD}
  monitoringPassword = ${?ADMIN_MONITORINGPASSWORD}
}

runtime {

  # Runtime server configuration
  http {
    port = ${?RUNTIME_HTTP_PORT}
    addresses = ${?RUNTIME_HTTP_ADDRESSES}
    jetty {
      minThreads = ${?RUNTIME_HTTP_JETTY_MINTHREADS}
      maxThreads = ${?RUNTIME_HTTP_JETTY_}
      maxFormContentSize = ${?RUNTIME_HTTP_JETTY_MAXFORMCONTENTSIZE}
      requestHeaderSize = ${?RUNTIME_HTTP_JETTY_REQUESTHEADERSIZE}
      responseHeaderSize = ${?RUNTIME_HTTP_JETTY_RESPONSEHEADERSIZE}
      statistics = ${?RUNTIME_HTTP_JETTY_STATISTICS}
    }
  }

  # License configuration
  license {
    key = ${?RUNTIME_LICENSE_KEY}
    id = ${?RUNTIME_LICENSE_ID}
  }

  # Database synchronization parameters
  database {
    syncMode = ${?RUNTIME_DATABASE_SYNCMODE}
    ddlLoggingPath = ${?RUNTIME_DATABASE_DDLLOGGINGPATH}
  }

  # Custom runtime settings
  params {
    "ApplicationRootUrl" = ${?RUNTIME_PARAMS_APPLICATIONROOTURL}
    "CACertificates" = ${?RUNTIME_PARAMS_CACERTIFICATES}
    "ClientCertificatePasswords" = ${?RUNTIME_PARAMS_CLIENTCERTIFICATEPASSWORDS}
    "ClientCertificateUsages" = ${?RUNTIME_PARAMS_CLIENTCERTIFICATEUSAGES}
    "ClientCertificates" = ${?RUNTIME_PARAMS_CLIENTCERTIFICATES}
    "ClientQueryTimeout" = ${?RUNTIME_PARAMS_CLIENTQUERYTIMEOUT}
    "ClusterManagerActionInterval" = ${?RUNTIME_PARAMS_CLUSTERMANAGERACTIONINTERVAL}
    "ConnectionPoolingMaxActive" = ${?RUNTIME_PARAMS_CONNECTIONPOOLINGMAXACTIVE}
    "ConnectionPoolingMaxIdle" = ${?RUNTIME_PARAMS_CONNECTIONPOOLINGMAXIDLE}
    "ConnectionPoolingMaxWait" = ${?RUNTIME_PARAMS_CONNECTIONPOOLINGMAXWAIT}
    "ConnectionPoolingMinIdle" = ${?RUNTIME_PARAMS_CONNECTIONPOOLINGMINIDLE}
    "ConnectionPoolingNumTestsPerEvictionRun" = ${?RUNTIME_PARAMS_CONNECTIONPOOLINGNUMTESTSPEREVICTIONRUN}
    "ConnectionPoolingSoftMinEvictableIdleTimeMillis" = ${?RUNTIME_PARAMS_CONNECTIONPOOLINGSOFTMINEVICTABLEIDLETIMEMILLIS}
    "ConnectionPoolingTestOnBorrow" = ${?RUNTIME_PARAMS_CONNECTIONPOOLINGTESTONBORROW}
    "ConnectionPoolingTestOnCreate" = ${?RUNTIME_PARAMS_CONNECTIONPOOLINGTESTONCREATE}
    "ConnectionPoolingTestOnReturn" = ${?RUNTIME_PARAMS_CONNECTIONPOOLINGTESTONRETURN}
    "ConnectionPoolingTestWhileIdle" = ${?RUNTIME_PARAMS_CONNECTIONPOOLINGTESTWHILEIDLE}
    "ConnectionPoolingTimeBetweenEvictionRunsMillis" = ${?RUNTIME_PARAMS_CONNECTIONPOOLINGTIMEBETWEENEVICTIONRUNSMILLIS}
    "DataStorage.DeleteByConstraintDeleteLimit" = ${?RUNTIME_PARAMS_DATASTORAGE_DELETEBYCONSTRAINTDELETELIMIT}
    "DataStorage.DeleteByConstraintRetrieveLimit" = ${?RUNTIME_PARAMS_DATASTORAGE_DELETEBYCONSTRAINTRETRIEVELIMIT}
    "DataStorage.OptimizeSecurityColumns" = ${?RUNTIME_PARAMS_DATASTORAGE_OPTIMIZESECURITYCOLUMNS}
    "DatabaseHost" = ${?RUNTIME_PARAMS_DATABASEHOST}
    "DatabaseJdbcUrl" = ${?RUNTIME_PARAMS_DATABASEJDBCURL}
    "DatabaseName" = ${?RUNTIME_PARAMS_DATABASENAME}
    "DatabasePassword" = ${?RUNTIME_PARAMS_DATABASEPASSWORD}
    "DatabaseType" = ${?RUNTIME_PARAMS_DATABASETYPE}
    "DatabaseUseIntegratedSecurity" = ${?RUNTIME_PARAMS_DATABASEUSEINTEGRATEDSECURITY}
