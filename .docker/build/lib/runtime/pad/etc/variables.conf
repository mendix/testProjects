    "com.mendix.storage.azure.UseHttps" = ${?RUNTIME_PARAMS_COM_MENDIX_STORAGE_AZURE_USEHTTPS}
    "com.mendix.storage.s3.AccessKeyId" = ${?RUNTIME_PARAMS_COM_MENDIX_STORAGE_S3_ACCESSKEYID}
