# This file provides an example configuration for the Mendix Runtime Server.
# It uses HOCON (https://github.com/lightbend/config/blob/main/HOCON.md),
# which is a superset of JSON, Java properties and some other formats.

# Configuration for the Admin/M2EE server.
admin {
  
  # The port number of the Admin/M2EE server.
  # Optional, integer [1024-65535], defaults to 8090.
  # port = 8090

  # The addresses the Admin/M2EE server will bind to.
  # This should be a comma-separated list, surrounded by brackets [ and ]
  # Both DNS names and IP addresses are allowed.
  # When the list is empty, the server defaults to localhost.
  # Use * to bind to all available addresses.
  # Optional, list of strings, defaults to empty (=localhost).
  # addresses = [ localhost ]

  # The password for authenticating Admin/M2EE commands.
  # Use single quotes to prevent variable expansion.
  # Mandatory, string, default to $M2EE_ADMIN_PASS if set.
  # adminPassword = ${?M2EE_ADMIN_PASS}

  # The password for authenticating monitoring/M2EE commands.
  # Use single quotes to prevent variable expansion.
  # Optional, string, defaults to the adminPassword.
  # monitoringPassword = ${adminpassword}

  # The file-system path for the admin console executable (on Windows).
  # Optional, string, default to empty
  # consolePath = 'C:\Program Files\Mendix\11.0.0\modeler\MendixConsoleLog.exe'
}

# Configuration for the runtime.
runtime {

  # Runtime web-server configuration
  http {

    # The port number of the runtime web-server.
    # Optional, integer [1024-65535], defaults to 8080.
    # port = 8080

    # The addresses the runtime web-server will bind to.
    # This should be a comma-separated list, surrounded by brackets [ and ]
    # Both DNS names and IP addresses are allowed.
    # Optional, list of strings, defaults to empty (=localhost).
    # addresses = [ localhost ]

    # Configuration for the underlying Jetty server.
    jetty {

      # The minimum number of pooled threads for the HTTP server.
      # Optional, integer [1->, defaults to 8.
      # minThreads = 8

      # The minimum number of pooled threads for the HTTP server.
      # Optional, integer [1->, defaults to 200.
      # maxThreads = 200

      # The maximum number of bytes for HTTP form content (application/x-www-form-urlencoded content in POST requests).
      # Optional, integer [1->, defaults to 200.000 (~195 KB).
      # maxFormContentSize = 200000

      # The maximum number of bytes for all incoming request headers.
      # Optional, integer [1->, defaults to 8 KB.
      # requestHeaderSize = 8192

      # The maximum number of bytes for all outgoing response headers.
      # Optional, integer [1->, defaults to 8 KB.
      # responseHeaderSize = 8192

      # Whether to enable statistics for the runtime server.
      # Optional, Boolean, defaults to false.
      # statistics = false
    }
  }

  # Configuration for database synchronization.
  database {

    # What to do when the database needs to be updated.
    # - auto: automatically synchronize the database to the application (recommended).
    # - manual: pause the synchronization and await execute_ddl_commands M2ee requests.
    # - abort: terminate the process.
    # Optional, enum, defaults to auto.
    # syncMode = auto

    # The path to the directory where to log the DLL statements that are (to be) performed.
    # This must be an existing directory; no logging is performed when empty.
    # Optional, string, defaults to empty.
    # ddlLoggingPath = '/opt/app/log/ddl'
  }

  # Custom settings for the runtime; see https://docs.mendix.com/refguide/custom-settings/.
  params {

    # The ApplicationRootUrl setting is used to specify the domain and path to your application.
    # This can be ued within Java actions to get the public location of the application, for example when including a URL to the application when sending emails from a scheduled event.
    # Type: String
    # ApplicationRootUrl = 

    # A comma-separated list of paths to CA certificates.
    # Example: D:\App\CA1.pem, D:\App\CA2.pem, D:\App\CA3.pem, D:\App\CA4.pem
    # Type: String
    # CACertificates = ""

    # Comma-separated list of passwords for Client Certificates (should match the ClientCertificates order).
    # Example: pwd1, pwd2, pwd3, pwd4
    # Type: String
    # ClientCertificatePasswords = ""

    # Only use this when you have multiple client certificates and you want to configure specific certificates for specific servers.
    # This setting defines which service must use which client certificate.
    # See NoClientCertificateUsages if you want to make sure that no client certificate is used for a certain host or web service.
    # The value of ClientCertificateUsages must be a comma-separated list of key/value items.
    # A key/value item must be specified as "identifier": "path to certificate".
    # For web services, use the imported web service name as the identifier.
    # For REST services, use the host name of the remote server as the identifier.
    # Please note that any backslash in the path must be doubled.
    # The whole value must be enclosed by braces ({ }).
    # Type: Object
    # ClientCertificateUsages = {}

    # Comma-separated list of paths to Client Certificates.
    # Example: D:\App\Mx1.pfx, D:\App\Mx2.pfx, D:\App\Mx3.pfx, D:\App\Mx4.pfx
    # Type: String
    # ClientCertificates = ""

    # Defines the timeout in seconds for most of the database queries which are executed to load data into client widgets, like data grids.
    # After the duration as specified here, a query will be canceled and an exception will be thrown.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as seconds)
    # ClientQueryTimeout = 

    # The interval (in milliseconds) used for performing all cluster manager actions.
    # These actions include, unblocking users, and removing invalid sessions.
    # If nothing is specified the interval is half the SessionTimeout.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # ClusterManagerActionInterval = ${SessionTimeout} / 2

    # Sets the cap on the total number of active instances from the pool.
    # Type: Int
    # ConnectionPoolingMaxActive = 50

    # Sets the cap on the number of "idle" instances in the pool.
    # Type: Int
    # ConnectionPoolingMaxIdle = 50

    # When the maximum number of "active" objects has been reached, the pool is said to be "exhausted." The "when exhausted" action used by the connection bus is WHEN_EXHAUSTED_BLOCK.
    # Sets the maximum amount of time (in milliseconds) the borrowObject() method should block before throwing an exception when the pool is exhausted.
    # When less than or equal to 0, the borrowObject() method may block indefinitely.
    # (!) 
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # ConnectionPoolingMaxWait = 10 seconds

    # Sets the minimum number of objects allowed in the pool before the evictor thread (if active) spawns new objects.
    # Note that no objects are created when numActive + numIdle >= maxActive.
    # This setting has no effect if the idle object evictor is disabled (as in, if timeBetweenEvictionRunsMillis <= 0).
    # Type: Int
    # ConnectionPoolingMinIdle = 0

    # Sets the maximum number of objects to examine during each run of the idle object evictor thread (if any).
    # When a negative value is supplied, ceil(getNumIdle())/ abs(getNumTestsPerEvictionRun()) tests will be run.
    # This means that when the value is -n, roughly one nth of the idle objects will be tested per run.
    # Type: Int
    # ConnectionPoolingNumTestsPerEvictionRun = -3

    # Sets the minimum amount of time an object may sit idle in the pool before it is eligible for eviction by the idle object evictor (if any), with the extra condition that at least minIdle objects remain in the pool.
    # When non-positive, no objects will be evicted from the pool due to idle time alone.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # ConnectionPoolingSoftMinEvictableIdleTimeMillis = 5 minutes

    # If true, a database connection will be validated by the connection pool before returning it to the application.
    # This can be useful in situations where database connections can be closed by processes outside of the Mendix runtime, like firewalls.
    # Type: Boolean
    # ConnectionPoolingTestOnBorrow = false

    # If true, a database connection will be validated by the connection pool after being created.
    # Type: Boolean
    # ConnectionPoolingTestOnCreate = false

    # If true, a database connection will be validated by the connection pool when it is returned to the pool by the application.
    # Type: Boolean
    # ConnectionPoolingTestOnReturn = false

    # If true, all idle database connections will be validated when the idle object evictor runs.
    # Type: Boolean
    # ConnectionPoolingTestWhileIdle = false

    # Sets the number of milliseconds to sleep between runs of the idle object evictor thread.
    # When non-positive, no idle object evictor thread will be run.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # ConnectionPoolingTimeBetweenEvictionRunsMillis = 5 minutes

    # Number of items to delete in a single delete query.
    # We do not expect that increasing this further has any performance benefit, as the overhead of query processing should already be small compared to actually deleting the items.
    # Type: Int
    # DataStorage.DeleteByConstraintDeleteLimit = 1000

    # Number of items to retrieve in a single query.
    # This is only limited by the memory used for the result set.
    # Type: Integer
    # DataStorage.DeleteByConstraintRetrieveLimit = 1000000

    # When true, query columns generated to evaluate XPath constraints in access rules are optimized to true if the runtime can determine that the value will always be true for the objects that the query returns.
    # This is almost always an improvement, but we have seen cases where the PostgreSQL query planner has worse performance for the simpler query.
    # Type: Boolean
    # DataStorage.OptimizeSecurityColumns = true

    # The host name and optionally the TCP port number of the database.
    # Use a colon (:) as separator between the host name and port number.
    # Possible values are: db.url.org, db.url.org:1521, 10.0.0.5, and10.0.0.5:1433.
    # It is possible to use a plain IPv6 address by enclosing it in brackets (for example, [::1]:5432).
    # Type: String
    # DatabaseHost = ""

    # Defines the JDBC URL to use for the database connection (which overrides the other database connection settings).
    # Type: String
    # DatabaseJdbcUrl = ""

    # The name of the database or schema used by the Mendix app 
    # Type: String
    # DatabaseName = ""

    # Password for the DatabaseUserName supplied above.
    # Type: String
    # DatabasePassword = ""

    # Defines the database engine which is used as the Mendix database.
    # Valid values are HSQLDB, MYSQL, ORACLE, POSTGRESQL, SAPHANA, and SQLSERVER.
    # Type: String (HSQLDB, MYSQL, ORACLE, POSTGRESQL, SAPHANA, SQLSERVER)
    # DatabaseType = ""

    # This setting defines whether integrated security will be used to authenticate to SQL Server.
    # If true, user name and password will not be used.
    # Ensure that the proper domain user for accessing the SQL Server is authenticated on the runtime server using the kinit command.
    # Type: Boolean
    # DatabaseUseIntegratedSecurity = false

    # When true, the connection will be made using SSL without certificate validation.
    # If you need certificate validation, use DatabaseJdbcUrl instead.
    # When false, the connection will be made without SSL (this is only relevant for SQL Server, which uses SSL by default).
    # Type: Boolean
    # DatabaseUseSsl = 

    # Name required for authentication to the database.
    # Type: String
    # DatabaseUserName = ""

    # Some libraries used by the Mendix runtime use Apache Commons for logging.
    # By default these log messages are suppressed.
    # Set this value to true to receive the log messages from these libraries in the Mendix logs.
    # Type: Boolean
    # EnableApacheCommonsLogging = false

    # Defines whether file documents should be cached.
    # Only enable this if you are sure that the file documents will not contain sensitive information.
    # Images are always cached.
    # Type: Boolean
    # EnableFileDocumentCaching = false

    # Defines whether the web client sends a keep alive request every SessionTimeout/2 milliseconds, to prevent a session timeout.
    # Each click in the browser also acts as KeepAlive.
    # Disabling this property will result in a user being logged out automatically after 10 minutes of inactivity, even if the browser remains open.
    # Type: Boolean
    # EnableKeepAlive = true

    # Specifies the hash algorithm used to generate hash values for attributes of the HashString type, such as the password of a user.
    # This setting overrides the setting in Studio Pro, see Hash Algorithm.
    # Possible values are BCRYPT, SSHA256, SHA256 (not recommended) and MD5 (not recommended).
    # To override the default BCrypt cost, you can specify BCRYPT:cost, where 'cost' is a number between 10 and 30.
    # An example value is BCRYPT:12.
    # Type: String (BCRYPT:x, SSHA256:x, SHA256:x, MD5:x)
    # HashAlgorithm = 

    # A JSON object containing custom headers as key/value pairs, and can be used to define a Content-Security-Policy.
    # For example, { "Content-Security-Policy": "script-src 'nonce-{{ NONCE }}'" }.
    # Type: Object
    # Headers = {}

    # Password for the default Java keystore.
    # Type: String
    # JavaKeyStorePassword = "changeit"

    # This setting defines whether integrated security will be used to authenticate to SQL Server.
    # If true, user name and password will not be used.
    # Ensure that the proper domain user for accessing the SQL Server is authenticated on the runtime server using the kinit command.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # LogMinDurationQuery = 

    # This setting is the same as SessionTimeout, but specific to offline-first progressive web apps.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # LongLivedSessionTimeout = 7 days

    # Common tags used for every meter 
    # Type: Object
    # Metrics.ApplicationTags = {}

    # Registries to send metrics to.
    # Type: Array of objects
    # Metrics.Registries = []

    # A comma-separated string with the names of the events.
    # Please don't forget the name of the module (a name can be, for example, CRM.UpdateCustomerStatistics).
    # Type: String
    # MyScheduledEvents = ""

    # Comma-separated list of host names or imported web service names that should never be contacted using a client certificate.
    # Type: String
    # NoClientCertificateUsages = ""

    # Defines the SERVICE_NAME when you have a connection with an Oracle DBMS.
    # Type: String
    # OracleServiceName = ""

    # Specify which scheduled events should be executed.
    # Choices are ALL, NONE, or SPECIFIED.
    # In the case of SPECIFIED, enumerate the scheduled events using the MyScheduledEvents configuration option described below.
    # Type: String (ALL, NONE, SPECIFIED)
    # ScheduledEventExecution = "NONE"

    # Defines how often a runtime writes session LastActive dates in its memory back to the database.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # SessionKeepAliveUpdatesInterval = ${ClusterManagerActionInterval} / 3

    # Defines after how much time a session becomes invalid (in milliseconds).
    # After that timeout, a session becomes eligible for removal.
    # The session will not be destroyed until the next time a scheduled task runs to clean up the active sessions.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # SessionTimeout = 10 minutes

    # Defines the file location of the built-in source database.
    # This setting is only necessary if a non-default location of the built-in database has to be used to copy the data from.
    # Type: String
    # SourceBuiltInDatabasePath = ""

    # The host name and optionally the TCP port number of the source database.
    # Use a colon as separator between host name and port number.
    # Possible values are: db.url.org, db.url.org:1521, 10.0.0.5, or 10.0.0.5:1433.
    # It's possible to use a plain IPv6 address by enclosing it in brackets (for example, [::1]:5432).
    # Type: String
    # SourceDatabaseHost = ""

    # Defines the JDBC URL to use for the source database connection (which overrides the other source database connection settings).
    # This feature is not supported for PostgreSQL databases.
    # Type: String
    # SourceDatabaseJdbcUrl = ""

    # The name of the source database.
    # Type: String
    # SourceDatabaseName = ""

    # The password for the connection to the source database.
    # Type: String
    # SourceDatabasePassword = ""

    # The type of the source database.
    # Possible values: HSQLDB, MYSQL, ORACLE, POSTGRESQL, SAPHANA, or SQLSERVER.
    # Type: String (HSQLDB, MYSQL, ORACLE, POSTGRESQL, SAPHANA, SQLSERVER)
    # SourceDatabaseType = ""

    # This setting defines whether integrated security will be used to authenticate to SQL Server.
    # If true, user name and password will not be used.
    # See DatabaseUseIntegratedSecurity for more information.
    # Type: Boolean
    # SourceDatabaseUseIntegratedSecurity = false

    # When true, the connection to the source database will be made using SSL without certificate validation.
    # If you need certificate validation, use SourceDatabaseJdbcUrl instead.
    # When false, the connection to the source database will be made without SSL (this is only relevant for SQL Server, which uses SSL by default).
    # Type: Boolean
    # SourceDatabaseUseSsl = 

    # The user name for the connection to the source database.
    # Type: String
    # SourceDatabaseUserName = ""

    # Defines the SERVICE_NAME when you have a connection with an Oracle DBMS as source.
    # Type: String
    # SourceOracleServiceName = ""

    # Time in ms to wait for task in a task queue to finish when shutting down.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # TaskQueue.ShutdownGracePeriod = 10 seconds

    # The location of the temporary files.
    # Type: String
    # TempPath = "${BasePath}/data/tmp"

    # Defines whether to update a user's LastLogin field on each login when logging in to a published REST, OData, or web service.
    # When this happens a database update query has to be sent and this can have performance consequences on heavy load systems.
    # When this setting is set to false, no database interaction is necessary.
    # Type: Boolean
    # TrackWebServiceUserLastLogin = true

    # The location of the uploaded files.
    # A valid path can be: \\FileServer\CustomerPortalFiles.
    # Type: String
    # UploadedFilesPath = "${BasePath}/data/files"

    # When set to true, the parseDateTime function will use more lenient parsing, as it did in Mendix 9.
    # For example parseDateTime("yyyyMMdd", "2021-11-10") will return 2020-11-01 as a date if this is set to true, which is probably not the intended result.
    # If set to false, which is the default, this example will throw an error as it is expecting 20211110.
    # It is recommended to not enable this setting to avoid unexpected results.
    # Type: Boolean
    # com.mendix.core.LenientDateTimeParsing = false

    # This setting specifies (in milliseconds) how old objects in the System.ProcessedQueueTask have to be before they are removed from the database.
    # See Task Queue for more details.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # com.mendix.core.ProcessedTasksCleanupAge = 

    # This setting specifies how many System.ProcessedQueueTask objects will be removed from the database each time the ProcessedTask cleanup action runs.
    # See Task Queue for more details.
    # Type: Integer
    # com.mendix.core.ProcessedTasksCleanupBatchSize = 

    # Type: String
    # com.mendix.core.SameSiteCookies = 

    # This setting specifies (in milliseconds) how old objects in the System.ScheduledEventInformation table have to be before they are removed from the database.
    # See Scheduled Events - Legacy for more details.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # com.mendix.core.ScheduledEventsCleanupAge = 

    # This setting specifies how many System.ScheduledEventInformation objects will be removed from the database each time the ScheduledEventInformation cleanup task runs.
    # See Scheduled Events - Legacy for more details.
    # Type: Integer
    # com.mendix.core.ScheduledEventsCleanupBatchSize = 

    # Defines the name of the cookie value which represents the session ID.
    # Can be useful to change when running in a container which assumes a certain name for the session cookie.
    # Type: String
    # com.mendix.core.SessionIdCookieNameKey = "XASSESSIONID"

    # Defines which storage service module will be used.
    # The storage service module takes care of storing the actual files associated with System.FileDocument objects, such as uploaded files.
    # Possible values are com.mendix.storage.
    # localfilesystem, com.mendix.storage.s3, and com.mendix.storage.azure.
    # Type: String
    # com.mendix.core.StorageService = "com.mendix.storage.localfilesystem"

    # Set to true in a high-availability scenario when this is not the Cluster Leader.
    # The buildpack will usually enforce this setting, but it may need to be set for some on-premises deployments.
    # Type: Boolean
    # com.mendix.core.isClusterSlave = 

    # Enable access to Micrometer metrics through Java APIs 
    # Type: String
    # com.mendix.metrics.Type = "micrometer"

    # This setting defines how often objects of type System.OfflineSynchronizationHistory are cleaned up.
    # Type: Duration (use suffixes like h(ours), d(ays) or w(eeks); without suffix the value is taken as days)
    # com.mendix.offline.SynchronizationCleanupInterval = 90 days

    # Set to true to allow web service users to access published OData and REST services when using basic authentication.
    # Type: Boolean
    # com.mendix.services.publish.AllowWebServiceUserBasicAuthenticationInODataAndREST = 

    # Defines whether a delete of a Mendix file document should result in an actual delete in the storage service.
    # A reason to not perform an actual delete in the storage service can be when it is also used as a backup service.
    # The options are: AllFiles – Deletes files from file storage TemporaryFiles – Deletes files which were created during a transaction but not referenced by any file document from file storage NoFiles – No files are deleted from file storage.
    # Additionally, we have legacy options true (same as AllFiles) and false (same as TemporaryFiles) which will be deprecated in the future.
    # Type: String
    # com.mendix.storage.PerformDeleteFromStorage = "AllFiles"

    # Account key to authenticate with the Azure blob storage service.
    # Type: String
    # com.mendix.storage.azure.AccountKey = ""

    # Account name to authenticate with the Azure blob storage service.
    # Type: String
    # com.mendix.storage.azure.AccountName = ""

    # Set the blob endpoint.
    # This setting is required when authentication by SharedAccessSignature or UseDefaultAzureCredential is used.
    # Type: String
    # com.mendix.storage.azure.BlobEndpoint = 

    # Name of the container containing the blob.
    # Type: String
    # com.mendix.storage.azure.Container = ""

    # Indicates whether to check if the container exists, and creates it if it does not exist.
    # Type: Boolean
    # com.mendix.storage.azure.CreateContainerIfNotExists = true

    # Maximum number of parallel multi-part file uploads/downloads.
    # We advise not changing this setting unless you experience slow file transfers for large files.
    # Choosing larger values will lead to higher memory usage.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # com.mendix.storage.azure.MaximumExecutionTimeInMs = 

    # Sets the maximum execution time (in milliseconds) to use when making this request.
    # For more information, see the Azure libraries.
    # Type: Int
    # com.mendix.storage.azure.ParallelismFactor = 5

    # Provides delegated access to resources in your storage account.
    # For more information, see Shared Access Signature on docs.microsoft.com.
    # Type: String
    # com.mendix.storage.azure.SharedAccessSignature = 

    # Sets the amount of time (in milliseconds) to allow a call to the storage service to complete.
    # For more information, see the Azure libraries.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # com.mendix.storage.azure.TimeoutIntervalInMs = 

    # Enables the use of the credential information present in the running environment.
    # For more information, see DefaultAzureCredential on Microsoft Learn.
    # Type: Boolean
    # com.mendix.storage.azure.UseDefaultAzureCredential = false

    # For enabling or disabling secure connections using HTTPS.
    # Can be true or false.
    # Type: Boolean
    # com.mendix.storage.azure.UseHttps = true

    # Acts as the username to authenticate with the S3 service.
    # Type: String
    # com.mendix.storage.s3.AccessKeyId = ""

    # Name of the bucket where the files are stored on S3.
    # Type: String
    # com.mendix.storage.s3.BucketName = ""

    # Overrides the default maximum connections limit in the S3 service.
    # The default value is enough for most applications, so we do not recommend explicitly setting this to a custom value unless a larger maximum connections limit is absolutely necessary.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # com.mendix.storage.s3.ClientExecutionTimeout = 

    # Sets the amount of time to wait (in milliseconds) when initially establishing a connection before giving up and timing out.
    # A value of 0 means infinity and is not recommended.
    # For more information, see the AWS Java SDK.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # com.mendix.storage.s3.ConnectionTimeout = 

    # List of keys which can be used to encrypt and decrypt data at rest in S3.
    # The right key to decrypt the data with is automatically selected depending on with which key it was encrypted.
    # Each encryption key consists of a key id, the encryption algorithm and the actual key (Base64 encoded).
    # Type: Array of objects
    # com.mendix.storage.s3.EncryptionKeys = []

    # Overrides the default endpoint.
    # This setting is required when the storage is on a non-AWS location (for example, IBM Cloud Object Storage).
    # Both the endpoint (for example, s3.example.com) or the full URL (including the protocol) are supported (for example, https://s3.example.com).
    # Note that when setting a custom endpoint, path style access will be enabled.
    # For more information, see Class S3ClientOptions.
    # Type: String
    # com.mendix.storage.s3.EndPoint = ""

    # The value true allows the server to route requests to a different region than specified in these settings (false disallows it).
    # Type: Boolean
    # com.mendix.storage.s3.ForceGlobalBucketAccessEnabled = true

    # Overrides the default maximum connections limit in the S3 service.
    # The default value is enough for most applications, so we do not recommend explicitly setting this to a custom value unless a larger maximum connections limit is absolutely necessary.
    # Type: Integer
    # com.mendix.storage.s3.MaxConnections = 

    # Sets the region in which the S3 bucket is located.
    # This will be used to determine the service endpoint, unless overridden in com.mendix.storage.s3.EndPoint.
    # This setting will also be used as the signing region for requests.
    # Type: String
    # com.mendix.storage.s3.Region = ""

    # Sets the amount of time to wait (in milliseconds) for the request to complete before giving up and timing out.
    # A value of 0 means no timeout.
    # For more information, see the AWS Java SDK.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # com.mendix.storage.s3.RequestTimeout = 

    # Prefix for the keys under which objects are stored.
    # Separators are not added automatically to keys.
    # For keys like prefix/key1, com.mendix.storage.s3.ResourceNamePrefix should have value prefix/.
    # Type: String
    # com.mendix.storage.s3.ResourceNamePrefix = ""

    # Suffix for the keys under which objects are stored.
    # This can be used when S3 buckets are divided into different segments for different users with different credentials (for example, store objects as [key].customer1 for customer1 and as [key].customer2 for customer2).
    # Separators are not added automatically to keys.
    # For keys like key1.customer1, com.mendix.storage.s3.ResourceNameSuffix should have value .customer1.
    # Type: String
    # com.mendix.storage.s3.ResourceNameSuffix = ""

    # Acts as the password to authenticate with the S3 service.
    # Type: String
    # com.mendix.storage.s3.SecretAccessKey = ""

    # Sets the amount of time to wait (in milliseconds) for data to be transferred over an established, open connection before the connection times out and is closed.
    # A value of 0 means infinity and is not recommended.
    # For more information, see the AWS Java SDK.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as milliseconds)
    # com.mendix.storage.s3.SocketTimeout = 

    # Set this value to true to use the configured CACertificates for the connection to the S3 service.
    # Type: Boolean
    # com.mendix.storage.s3.UseCACertificates = false

    # Lets the authentication policy use Signature Version 2 instead of the default Signature Version 4.
    # Set this setting to true when the endpoint does not support Signature Version 4.
    # Type: Boolean
    # com.mendix.storage.s3.UseV2Auth = false

    # The threshold controls how much data is sent back to the client after executing a microflow.
    # By default, we send back full objects when they are changed or committed.
    # When this threshold is reached, only object GUIDs are sent back instead so that the client knows about the changes while the amount of data sent over the network is reduced.
    # The client will then retrieve the objects later on, if needed.
    # Type: Int
    # com.mendix.webui.CommittedObjectsThreshold = 100

    # A warning is logged when the feedback size exceeds the threshold.
    # Feedback is sent from server to client to instruct (for example, to refresh objects or to open a page).
    # They are serialized as "instructions" in the server response.
    # If there are too many instructions, this can have performance implications, as they all have to be serialized to the client.
    # For this reason, a warning is logged when the threshold is exceeded.
    # Type: Int
    # com.mendix.webui.FeedbackSizeWarningThreshold = 5000

    # Determines how many minutes your token will remain valid before re-authenticating using your full credentials.
    # If no value is set, the token will expire after One year.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as minutes)
    # com.mendix.webui.HybridAppLoginTimeOut = 

    # A warning is logged when the state size exceeds the threshold.
    # The state consists of changes in objects and of objects not committed to the database (yet).
    # If there is too much state, this will have performance implications, as the whole state has to be serialized to the client.
    # For this reason, a warning is logged when the threshold is exceeded.
    # Type: Int
    # com.mendix.webui.StateSizeWarningThreshold = 100

    # For the call REST service and call web service activities, the first request to a new host will create an HTTP client that will handle subsequent requests.
    # When there are no new requests to the host for the specified time, the HTTP client will be cleaned up.
    # A value of 0 means no cleanup.
    # Type: Duration (use suffixes like s(econds), m(inutes) or h(ours); without suffix the value is taken as seconds)
    # http.client.CleanupAfterSeconds = 

    # The maximum number of connections for a route for call REST service and call web service activities.
    # Type: Integer
    # http.client.MaxConnectionsPerRoute = 

    # The maximum number of connections allowed across all routes for the call REST service and call web service activities.
    # Type: Integer
    # http.client.MaxConnectionsTotal = 

    # Defines the hostname of the HTTP proxy server.
    # Type: String
    # http.proxyHost = ""

    # Defines the password of the HTTP proxy server.
    # Type: String
    # http.proxyPassword = ""

    # Defines the port number of the HTTP proxy server.
    # Type: String
    # http.proxyPort = ""

    # Defines the user of the HTTP proxy server.
    # Type: String
    # http.proxyUser = ""

    # The maximum length of the JSON string received from the remote which can be processed with import mapping.
    # Use this setting when you expect a string which is longer than the default.
    # See Import Mappings for more information.
    # Type: Integer
    # mapping.import.MaxJsonReadingLength = 
  }

  # Configuration of the admin user.
  adminUser {
  
    # The name of the admin user.
    # Optional, string, defaults to 'MxAdmin'.
    # name = MxAdmin

    # The login password for the admin user (typically MxAdmin).
    # Use single quotes to prevent variable expansion.
    # Optional, string, defaults to empty.
    # password = "Very5ecret!"
  }

  # The password for enabling the debugger.
  # When empty, the debugger is not enabled.
  # Use quotes to prevent variable expansion or interpretation of special characters.
  # Optional, string, defaults to empty.
  # debugger.password = ""
}

# Configuration of the logging system.
# This is an array of one or more objects, each configuring a log subscriber.
logging = [
  {
    # The name of the log subscriber.
    # Mandatory, string, no default.
    name = MySubscriber

    # The type of log subscriber.
    # - console: log messages to the console (stdout).
    # - console_json: log JSON objects to the console (stdout).
    # - file: log messages to a file.
    # - java_logger: log messages to a Java log subscriber.
    # - syslog: log message to the system log.
    # - tcpjsonline: log JSON objects to a (TCP) server.
    # - opentelemtry: log messages to Open Telemtry.
    # Mandatory, enum, no default.
    type = console

    # The log levels at which to subscribe new log nodes.
    # - CRITICAL: only critical error messages.
    # - ERROR: error messages and the previous level (=critical error messages).
    # - WARNING: warning messages and all previous levels.
    # - INFO: information messages and all previous levels.
    # - DEBUG: debug messages and all previous levels.
    # - TRACE: detailed debug messages and all previous levels.
    # - NONE: log no messages.
    # Mandatory, enum, no default.
    autoSubscribe = INFO

    # The log levels configuration for individual log nodes.
    levels {

      # The name of the log node (=key), followed by the log level for it (=value).
      # Enclose names that contain spaces or dots or other special characters with single (or double) quotes.
      # Examples:
      # Core = DEBUG
      # 'Workflow Engine' = TRACE
      # 'org.apache.commons.dbcp2.ObjectNameWrapper' = WARNING
    }

    # [console-json only]

    # Whether to include tracing information or not.
    # Optional, Boolean, defaults to false.
    # includeTracingInformation = false

    # The name of the trace ID attribute.
    # Mandatory, string, no default.
    # traceIdAttribute = traceId

    # The name of the span ID attribute.
    # Mandatory, string, no default.
    # spanIdAttribute = spanId

    # The tags to include.
    # Optional, key-value pairs in a JSON object, defaults to an empty object.
    # tags = { }

    # [file only]

    # The path of the file to write to.
    # Mandatory, string, no default.
    # filename = '/var/log/mendix/runtime.log'

    # The maximum size in bytes of a log file.
    # Upon reaching the maximum size, the file is rotated and a new file is created.
    # When empty, the file size is not limited.
    # Optional, integer, defaults to empty.
    # maxSize =

    # The maximum number of rotated files to keep.
    # When empty, no rotated files are deleted.
    # Optional, integer, defaults to empty.
    # maxRotate =

    # [syslog only] 

    # The logging facility (KERN, USER, MAIL, DAEMON, etc.).
    # Mandatory, string, no default.
    # facility =
 
    # The host (DNS name or IP address) to log to.
    # Optional, string, defaults to localhost.
    # host = localhost
 
    # The port number to log to.
    # Optional, integer [1-65535], defaults to 514.
    # port = 514
 
    # The prefix to use.
    # Mandatiory, string, no default.
    # prefix = 'my-app'

    # [tcpjsonlines only]

    # The host (DNS name or IP address) to log to.
    # Mandatory, string, no default.
    # host = localhost
 
    # The port number to log to.
    # Mandatory, integer [1-65535], no default.
    # port = 12345
  }
]

