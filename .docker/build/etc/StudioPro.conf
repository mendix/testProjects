# This file contains all settings that are specified in Studio Pro, outside of Configurations

runtime {
  params {

    # Development mode
    DTAPMode = D

    # Enabled scheduled events
    ScheduledEventExecution = "NONE"
    MyScheduledEvents = ""

    # Configured certificates
    CACertificates = ""
    ClientCertificates = ""
    ClientCertificatePasswords = ""

    # Runtime tab
    HashAlgorithm = "BCRYPT:10"
  }

  # MxAdmin password (updates admin password when set)
  adminUser.password = ""

  # Debugger password (enables debugger when set)
  debugger.password = ""
}

logging = [
  {
    name = MySubscriber
    type = console
    autoSubscribe = INFO
    levels {
      # No overrides defined
    }
  }
]